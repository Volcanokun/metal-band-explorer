spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      schema-locations: classpath:test-schema.sql
      mode: always
  flyway:
    enabled: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  quartz:
    auto-startup: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.metalexplorer.domain.artist,com.metalexplorer.domain.history,com.metalexplorer.domain.tag
  configuration:
    map-underscore-to-camel-case: true

lastfm:
  api-key: test-api-key
  base-url: http://localhost:${wiremock.port:8089}

resilience4j:
  retry:
    instances:
      lastfmApi:
        max-attempts: 1
  timelimiter:
    instances:
      lastfmApi:
        timeout-duration: 10s
  circuitbreaker:
    instances:
      lastfmApi:
        minimum-number-of-calls: 100
