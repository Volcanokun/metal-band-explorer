spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  quartz:
    auto-startup: false

lastfm:
  api-key: test-api-key
  base-url: http://localhost:${wiremock.port:8089}

resilience4j:
  retry:
    instances:
      lastfmApi:
        max-attempts: 1
  timelimiter:
    instances:
      lastfmApi:
        timeout-duration: 10s
  circuitbreaker:
    instances:
      lastfmApi:
        minimum-number-of-calls: 100
