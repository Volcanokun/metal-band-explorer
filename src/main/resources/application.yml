spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/metalexplorer}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  quartz:
    job-store-type: memory
    properties:
      org.quartz.threadPool.threadCount: 1

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.metalexplorer.domain.artist,com.metalexplorer.domain.history,com.metalexplorer.domain.tag
  configuration:
    map-underscore-to-camel-case: true

lastfm:
  api-key: ${LASTFM_API_KEY}
  base-url: https://ws.audioscrobbler.com/2.0

resilience4j:
  circuitbreaker:
    instances:
      lastfmApi:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  retry:
    instances:
      lastfmApi:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  timelimiter:
    instances:
      lastfmApi:
        timeout-duration: 5s
  bulkhead:
    instances:
      lastfmApi:
        max-concurrent-calls: 10

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      cloudwatch:
        enabled: ${CLOUDWATCH_ENABLED:false}
        namespace: MetalExplorer
        step: 1m
